<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop | Jasmine Scents and Blooms</title>
  <meta name="description" content="Bouquets, flower boxes, perfumes and gift sets. Order on WhatsApp from Jasmine Scents and Blooms, Kisii.">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="shop">
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow">Our shop</span>
        <h1>Flowers, perfumes &amp; gifts</h1>
        <p>Tap <strong>Order on WhatsApp</strong> on any item. We'll confirm availability, delivery and the total, then you pay by M-Pesa.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="filters">
          <div class="chips" id="chips"></div>
          <div class="filter-right">
            <select id="occasion" aria-label="Filter by occasion"></select>
            <input id="search" type="search" placeholder="Search…" aria-label="Search products">
          </div>
        </div>
        <div class="grid" id="products"></div>
      </div>
    </section>

    <section class="section section--sand">
      <div class="container" style="text-align:center">
        <span class="eyebrow">Make it extra special</span>
        <h2>Add-ons for any order</h2>
        <p id="extras" style="color:var(--muted)"></p>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/main.js"></script>
</body>
</html>
