<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact & directions | Jasmine Scents and Blooms</title>
  <meta name="description" content="Find our two shops in Kisii, opening hours, delivery areas and answers to common questions.">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow">Contact &amp; directions</span>
        <h1>Visit or message us</h1>
        <p>Two shops in Kisii, and delivery to your door. <span class="swahili">Karibu sana!</span></p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-head">
          <span class="eyebrow">Our shops</span>
          <h2>How to find us</h2>
        </div>
        <div class="panel-grid" id="shops"></div>
      </div>
    </section>

    <section class="section section--sand">
      <div class="container panel-grid">
        <div class="panel">
          <h3>Call or WhatsApp</h3>
          <ul class="contact-list" id="contact-list"></ul>
        </div>
        <div class="panel">
          <h3>Opening hours</h3>
          <ul class="hours" id="hours"></ul>
        </div>
        <div class="panel">
          <h3>Delivery</h3>
          <div id="delivery"></div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-head">
          <span class="eyebrow">FAQ</span>
          <h2>Common questions</h2>
        </div>
        <div class="faq" id="faq"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/main.js"></script>
</body>
</html>
